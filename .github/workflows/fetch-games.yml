# fetch-games.yml
#
# Once a day, this workflow downloads new rapid and daily games from
# Chess.com, saves them in games/, and commits them. The commit triggers a
# Netlify deploy, so new games show up on the site without any manual work.
# You can also run it any time from the repo's Actions tab ("Run workflow").

name: Fetch Chess.com games

on:
  # Runs every day at 11:13 UTC, which is early morning in Memphis.
  # GitHub may delay scheduled runs by a few minutes, which doesn't matter here.
  schedule:
    - cron: "13 11 * * *"
  # Adds a "Run workflow" button on the Actions tab for on-demand syncs.
  workflow_dispatch:
    inputs:
      months:
        description: 'How many recent months to check ("all" for full history)'
        required: false
        default: "2"

# The workflow needs permission to push the new games back to the repo.
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Your account only allows actions from repos you own, so this workflow
      # uses no third-party actions. GitHub's runners already include git and
      # Node.js, so a plain git clone replaces actions/checkout, and the
      # built-in token lets the job push the new games back afterward.
      - name: Clone the repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" .
          node --version

      # Install the repo's packages; the script uses chess.js to read games.
      - name: Install packages
        run: npm ci --no-audit --no-fund

      # Download new games and write them into games/.
      - name: Fetch new games
        env:
          CHESSCOM_USER: atf901
          TIME_CLASSES: rapid,daily
          MONTHS: ${{ github.event.inputs.months || '2' }}
        run: node scripts/fetch-chesscom-games.mjs

      # Commit and push only when something actually changed, so quiet days
      # don't create empty commits or trigger pointless Netlify deploys.
      - name: Commit new games
        run: |
          if [ -z "$(git status --porcelain -- games/)" ]; then
            echo "No new games today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add games/
          git commit -m "Add new Chess.com games"
          git push
