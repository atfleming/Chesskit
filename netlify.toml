# netlify.toml
#
# Tells Netlify how to build and serve this site. Chesskit exports to a plain
# static site in the out/ folder, so no server or paid plan is needed.

[build]
  # "npm run build" first runs "prebuild", which turns games/*.pgn into
  # public/games.json, then runs Next.js' static export.
  command = "npm run build"
  # Folder Next.js writes the finished static site into.
  publish = "out"

[build.environment]
  # Chesskit requires Node.js 22.11 or newer.
  NODE_VERSION = "22"

# The Stockfish engine runs on multiple threads in the browser, which only
# works when the page is "cross-origin isolated". These two headers turn that
# on for every page, matching the nginx config the original project uses.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Opener-Policy = "same-origin"

# Engine files are large and never change for a given version, so browsers
# can cache them for a year instead of downloading them on every visit.
[[headers]]
  for = "/engines/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
